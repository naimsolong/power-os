services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: poweros-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-3000}
      RUST_LOG: ${RUST_LOG:-info}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-poweros}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      LHDN_CLIENT_ID: ${LHDN_CLIENT_ID}
      LHDN_CLIENT_SECRET: ${LHDN_CLIENT_SECRET}
      LHDN_TIN: ${LHDN_TIN}
      LHDN_SANDBOX: ${LHDN_SANDBOX:-true}
    volumes:
      - .:/app
      - cargo-target:/app/target
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - poweros

  db:
    image: postgres:16-alpine
    container_name: poweros-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-poweros}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-poweros}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - poweros

  minio:
    image: quay.io/minio/minio:latest
    container_name: poweros-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - poweros

  caddy:
    image: caddy:2-alpine
    container_name: poweros-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - poweros

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
  cargo-target:

networks:
  poweros:
    driver: bridge
